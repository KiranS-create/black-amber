version: "3.8"

services:
  sih26237-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih26237-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    environment:
      - SIH_HOST=0.0.0.0
      - SIH_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
