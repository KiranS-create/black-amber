version: "3.8"

services:
  aegistrace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegistrace-workstation
    ports:
      - "8000:8000"
    volumes:
      - aegistrace-data:/app/data
      - aegistrace-artifacts:/app/artifacts
    environment:
      - SIH_HOST=0.0.0.0
      - SIH_PORT=8000
      - DEMO_AUTH_ENABLED=${DEMO_AUTH_ENABLED:-false}
      - DEMO_USERNAME=${DEMO_USERNAME:-admin}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-admin}
      - DEMO_TENANT_ID=${DEMO_TENANT_ID:-demo_tenant}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  aegistrace-data:
    driver: local
  aegistrace-artifacts:
    driver: local
